<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Спосіб 1: &lt;table&gt;</h2>

  <table class="data-table">
    <thead>
      <tr>
        <th>Company</th>
        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
        <th>Q4</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="company">Microsoft</td>
        <td>20.3</td>
        <td>30.5</td>
        <td>23.5</td>
        <td>40.3</td>
      </tr>
      <tr>
        <td class="company">Google</td>
        <td>50.2</td>
        <td>40.63</td>
        <td>45.23</td>
        <td>39.3</td>
      </tr>
      <tr>
        <td class="company">Apple</td>
        <td>25.4</td>
        <td>30.2</td>
        <td>33.3</td>
        <td>36.7</td>
      </tr>
      <tr>
        <td class="company">IBM</td>
        <td>20.4</td>
        <td>15.6</td>
        <td>22.3</td>
        <td>29.3</td>
      </tr>
    </tbody>
  </table>

  <h2>Спосіб 2: float</h2>

  <div class="float-table">
    <div class="float-row header-row">
      <div class="float-cell">Company</div>
      <div class="float-cell">Q1</div>
      <div class="float-cell">Q2</div>
      <div class="float-cell">Q3</div>
      <div class="float-cell">Q4</div>
    </div>
    <div class="float-row">
      <div class="float-cell company">Microsoft</div>
      <div class="float-cell">20.3</div>
      <div class="float-cell">30.5</div>
      <div class="float-cell">23.5</div>
      <div class="float-cell">40.3</div>
    </div>
    <div class="float-row">
      <div class="float-cell company">Google</div>
      <div class="float-cell">50.2</div>
      <div class="float-cell">40.63</div>
      <div class="float-cell">45.23</div>
      <div class="float-cell">39.3</div>
    </div>
    <div class="float-row">
      <div class="float-cell company">Apple</div>
      <div class="float-cell">25.4</div>
      <div class="float-cell">30.2</div>
      <div class="float-cell">33.3</div>
      <div class="float-cell">36.7</div>
    </div>
    <div class="float-row">
      <div class="float-cell company">IBM</div>
      <div class="float-cell">20.4</div>
      <div class="float-cell">15.6</div>
      <div class="float-cell">22.3</div>
      <div class="float-cell">29.3</div>
    </div>
  </div>

</body>
</html>
