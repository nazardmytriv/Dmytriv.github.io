<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спортивний інвентар — Каталог</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="wrapper">

    <h1 class="catalog-title">ОБОВ'ЯЗКОВО ДОДАЙТЕ СВОЄ ЗАМОВЛЕННЯ</h1>

    <div class="catalog">

      <!-- Стрілка ліво -->
      <button class="arrow arrow-left">&lt;</button>

      <!-- ======= Блок 1 ======= -->
      <div class="card">
        <div class="badge badge-new">НОВИНКА</div>
        <p class="category">ФУТБОЛ</p>
        <hr class="divider">
        <a href="https://www.adidas.ua/futbolnij-m-yach-tiro-pro-performance-fs0373" target="_blank" class="img-link">
          <img src="img/ball.png" alt="Футбольний м'яч" class="product-img">
        </a>
        <a href="https://www.adidas.ua/futbolnij-m-yach-tiro-pro-performance-fs0373" target="_blank" class="product-name">М'ЯЧ ADIDAS TIRO</a>
        <p class="price">2098 ГРН</p>
        <a href="https://www.adidas.ua/futbolnij-m-yach-tiro-pro-performance-fs0373" target="_blank" class="btn btn-cart">У КОРЗИНУ</a>
      </div>

      <!-- ======= Блок 2 ======= -->
      <div class="card">
        <p class="category">ТЕННІС</p>
        <hr class="divider">
        <a href="https://sportano.ua/p/590249/raketka-tenisna-wilson-pro-staff-precision-100" target="_blank" class="img-link">
          <img src="img/racket.png" alt="Тенісна ракетка" class="product-img">
        </a>
        <a href="https://sportano.ua/p/590249/raketka-tenisna-wilson-pro-staff-precision-100" target="_blank" class="product-name">РАКЕТКА WILSON PRO</a>
        <p class="price">
          <span class="old-price">5129 ГРН</span>
          <span class="new-price">2190 ГРН</span>
        </p>
        <a href="https://sportano.ua/p/590249/raketka-tenisna-wilson-pro-staff-precision-100" target="_blank" class="btn btn-cart">У КОРЗИНУ</a>
      </div>

      <!-- ======= Блок 3 ======= -->
      <div class="card">
        <div class="badge badge-hit">ХІТ<br>ПРОДАЖІВ</div>
        <p class="category">ПЛАВАННЯ</p>
        <hr class="divider">
        <a href="https://arenaswim.com.ua/okuliary-dlia-plavannia-zmahalni-speedo-fastskin-hyper-elite-mirror-8-12818f977-chorni-zoloti-dzerkalni-8-12818f977/" target="_blank" class="img-link">
          <img src="img/goggles.png" alt="Окуляри для плавання" class="product-img">
        </a>
        <a href="https://arenaswim.com.ua/okuliary-dlia-plavannia-zmahalni-speedo-fastskin-hyper-elite-mirror-8-12818f977-chorni-zoloti-dzerkalni-8-12818f977/" target="_blank" class="product-name">ОКУЛЯРИ SPEEDO FASTSKIN</a>
        <p class="price">3299 ГРН</p>
        <a href="https://arenaswim.com.ua/okuliary-dlia-plavannia-zmahalni-speedo-fastskin-hyper-elite-mirror-8-12818f977-chorni-zoloti-dzerkalni-8-12818f977/" target="_blank" class="btn btn-cart">У КОРЗИНУ</a>
      </div>

      <!-- ======= Блок 4 ======= -->
      <div class="card">
        <div class="badge badge-hit">ХІТ<br>ПРОДАЖІВ</div>
        <p class="category">БІГОВІ ЛИЖІ</p>
        <hr class="divider">
        <a href="https://sportano.ua/p/814349/lizhi-girs-ki-fischer-rc4-sti-twin-powerrail-kriplennja-rs-10-gw-pr" target="_blank" class="img-link">
          <img src="img/ski.png" alt="Бігові лижі" class="product-img">
        </a>
        <a href="https://sportano.ua/p/814349/lizhi-girs-ki-fischer-rc4-sti-twin-powerrail-kriplennja-rs-10-gw-pr" target="_blank" class="product-name">ЛИЖІ FISCHER TWIN SKIN</a>
        <p class="price">9999 ГРН</p>
        <a href="https://sportano.ua/p/814349/lizhi-girs-ki-fischer-rc4-sti-twin-powerrail-kriplennja-rs-10-gw-pr" target="_blank" class="btn btn-cart">У КОРЗИНУ</a>
      </div>

      <!-- Стрілка право -->
      <button class="arrow arrow-right">&gt;</button>

    </div><!-- /.catalog -->

  </div><!-- /.wrapper -->

</body>
</html>
